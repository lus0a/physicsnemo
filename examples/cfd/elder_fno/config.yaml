hydra:
  job:
    chdir: True            # 让 hydra 把工作目录切到 run.dir (训练写出的文件都落到那里)
  run:
    dir: ./outputs_elder_${model.arch}  # 随 arch 自动切换: fno→outputs_elder_fno, ufno→outputs_elder_ufno

# PDE 参数 (SI 国际单位; 变密度、非 Boussinesq 的 Elder 问题, 原始变量 c 和 p,
# 对应 UG4 Lua 的 non-Boussinesq elder 设置)。
physics:
  phi: 0.1                 # 孔隙度 (无量纲), 多孔介质的孔隙体积占比
  Dm: 3.565e-6             # 分子扩散系数 Dm [m^2/s], 浓度的物理扩散
  permeability: 4.845e-13  # 渗透率 k [m^2], Darcy 定律里的多孔介质渗透性
  viscosity: 1.0e-3        # 流体动力粘度 mu [Pa·s] (水)
  g: 9.81                  # 重力加速度 (向下为正) [m/s^2]
  rho_f: 1000.0            # 淡水密度 rho_f [kg/m^3]
  drho: 200.0              # 密度差: rho(c) = rho_f + drho*c [kg/m^3], c=1 时密度增加 200
  W: 600.0                 # 计算域宽度 [m]
  H: 150.0                 # 计算域高度 [m] (W/H 决定宽高比; 方形网格 dx=dy)
  p_scale: null            # 水头归一化尺度 (h/p_scale 喂给网络)。null => 经验值:
                           # 取预滚轨迹实测的 max|h| (~48142 Pa), 让 h 归一化到 O(1)。
                           # 显式给数值则用该数值 (续训一致性时建议显式固定)。
  dt_macro: 864000.0       # 单步时长 [s]。VTU 路径自动从 file_stride × 文件间隔推导 (改 file_stride 即可,
                           # 此值在 VTU 路径被忽略); 仅在线 datapipe / VTS 路径用它。
  flow_sign: 1.0           # 浮力方向: +1 => dense(c=1) 流体下沉; 若指进上浮则翻成 -1

# 在线数据生成 (非周期、有壁边界), 由 ElderProblem2D 参考解实时产生单步对
data:
  resolution: 64           # 宽度方向内部网格数 Nx; 全网格 (含壁) 为 (Ny+2)x(Nx+2)
  source_frac: 0.5         # 顶部 c=1 源段占顶部宽度的比例 (居中)
  # U-FNO 比 vanilla FNO 更吃显存 (每层 U-Net skip + FFT)。
  # 64×256 + latent=64 + pad=8, 3090 24GB 实测: B=16 ~7.5GiB → 可开到 32~48;
  # B=128 会 OOM。OOM 时降 batch 或确认 use_amp=true。多 stride 时 B≥32 每档样本更够。
  batch_size: 48            # 每个 training step 的单步对数量
  substeps: 4              # 输运子步数下限 (按 CFL 自动增大, 取 max(此值, CFL 需要))
  max_substeps: 4000       # 子步数上限 (稳定性 vs 计算量; 触顶说明 CFL 过严需调参)
  n_trajectories: 16       # 同时推进的独立轨迹数 (批处理求解, 互相错相提供多样性)
  rollout_steps: 120       # 一条轨迹推进多少 macro 步后 reset 回初值 (~10 年 @ 30 天/步)
  steps_per_epoch: 64      # 每个 epoch 产出多少 batch (即多少 optimizer step)
  file_stride: 3           # 配对跨步数 (原始文件间隔 10 天): pair k = 快照k -> 快照k+file_stride。
                           # =1 => 10 天/步; =3 => 30 天/步。保留全部快照(不抽稀), 任意步长都不缩水。须与 dt_macro 一致。
  file_strides: [1, 2, 4, 8, 16]  # 变步长训练: 2× 几何等距 (10/20/40/80/160 天), 对齐 Newton 步长 2× 增长。
                           # 仅 dt_channel=true 时数据集使用; dt_channel=false 或缺失则回退 [file_stride] 单步长。
  val_frac: 0.2            # VTU/VTS 真实数据留出验证比例 (val 快照占总数比例)。
  n_val_blocks: 6          # val 拆成多少块, 均匀散布在时间轴上 (覆盖早/中/晚多时段, 避免单段集中)。
                           # 块少 => gap 缓冲区少 => 纯 train 快照多, 大 stride (16) 的训练对更容易凑齐。
  val_gap: 4               # val 块两侧缓冲 (快照数, ~40 天)。不必 = max(stride): _select_pairs 的端点检查已防跨边界泄漏,
                           # 这里只是相似度缓冲 (端点别太靠近 val 快照)。设太大 (=max stride) 会吃掉过多训练数据。
                           # 仅 train_dir 路径生效; 在线 datapipe 用独立轨迹作 val。
  train_dir: DataSet       # 真实数据目录; 优先 .vtu (unisolver 高精度), 次 .vts, 否则回退在线 datapipe
                           # 注意: resolution 仅在线 datapipe 路径用; .vtu/.vts 的网格尺寸来自文件本身

# FNO / U-FNO 网络 (输入: c_n, h_n[, d̃]  ->  输出: c/h 或 residual Δ)
model:
  arch: fno                # fno = PhysicsNeMo vanilla FNO
                           # ufno = Wen et al. (2022) U-FNO: lift → Fourier×L → U-Fourier×M → project
                           #   U-Fourier: σ(K(v)+U(v)+W(v)), U=two-step U-Net (see ufno.py).
                           # 换架构后必须重新训练; 与旧 parallel-FNO+UNet 及 vanilla FNO 的 .mdlus 均不兼容。
  # 可选: 显式 L/M; 默认各取 num_fno_layers 的一半 (论文推荐 half+half)
  # num_fourier_layers: 2
  # num_ufourier_layers: 2
  coord_features: false    # ufno: 是否在 lift 前拼归一化 (x,y) 网格通道
  dt_channel: true         # true => 输入加第 3 通道 (归一化 dt 常数场), 模型变 3 通道、变步长 aware;
                           # false => 原 2 通道 (c_n, h_n)。in_channels 由本开关派生 = 2 + int(dt_channel)。
  dt_ref_s: 3456000.0      # dt 归一化参考 (秒, =40 天 = 10~160 天几何中心); 第 3 通道填 d̃ = Δt/dt_ref_s ∈ {0.25,0.5,1,2,4}。
  out_channels: 2          # 输出通道: (c_{n+1}, h_{n+1})
  decoder_layers: 1        # 末端 MLP 解码器的层数 (把隐空间投影回 2 通道输出)
  decoder_layer_size: 64   # 解码器隐藏宽度
  dimension: 2             # 空间维数 (2D Elder)
  latent_channels: 64      # FNO 各 spectral conv 层的通道宽度 (容量主参数之一)
  num_fno_layers: 4        # ufno: L+M 总层数 (默认 L=M=2); fno: spectral 层数
  num_fno_modes: 0.8       # 每轴保留的 Fourier 模数。float in (0,1] => 占可用模数的比例
                           # (随分辨率/padding 自动缩放); list of ints => 显式 [modes_y, modes_x]。
                           # 0.8 在 4:1 网格 (padded 26x74) 上解析为 [10, 29]
  padding: 8               # spectral conv 前的零填充 (缓解非周期边界导致的频谱泄漏)

training:
  max_epochs: 200          # 训练总 epoch 数 (旧 100 在 ep45 后被小 lr 拖住没训够, 加到 200)
  start_lr: 1.0e-3         # Adam 初始学习率
  gamma: 0.9999            # ExponentialLR 每 step (batch) 的衰减率 (非每 epoch! lr 每 step *= gamma)。
                           # 0.9995 太猛: 64 step/ep × 100 ep = 6400 step → lr 掉到初值 4% (4e-5), 后期学不动;
                           # 0.9999: 200 ep (12800 step) 后 lr≈初值 28% (~2.8e-4), 后期能继续收敛。
  physics_weight: 0.0      # PDE 残差项权重; 0 = 纯数据拟合。>0 逼网络学 h-c 耦合 (h 难学时开)
  p_data_weight: 1.0       # 数据 loss 里水头项 MSE(pred_h,h1) 的权重 (c 项权重恒为 1)
  residual: true           # 残差预测: true => 网络输出增量 Δ, 重建 c_{n+1}=c_n+Δc / h_{n+1}=h_n+Δh,
                           # 专为 h 小信号问题。false => 直接预测全场。
                           # A/B 对照时: 先 false 跑基线, 再 true 跑残差版, 其它配置完全相同。
  zero_init: false         # 残差模式下是否零初始化 decoder 末层。true => 起步=不变基线 (但梯度弱易卡住);
                           # false => 标准残差结构 (正常梯度, 推荐)。仅 residual=true 时生效。
  # PDE 残差后端:
  #   own_fd      — 原中心差分 (masked L1 + scale, 与 unisolver F 不对齐)
  #   unisolver_fv — 与 Elder::FormFunction 对齐的 FV 残差 (可反传, 推荐接 Newton)
  physics_backend: unisolver_fv
  pin_enable: false       # 仅 unisolver_fv: 残差里是否加左上/右上角压力 pin (P=p_gauge)。
                          # false (强烈推荐): 物理损失只管质量/溶质守恒 (梯度项), 绝对压力交给数据 loss;
                          # true 时这 2 个角会以 ~1e12 量级主导 loss_pde, 训练跑偏 (实测)。
  continuity_weight: 1.0   # own_fd: 连续性权重; unisolver_fv: transport 相对 flow 的权重 (w_c)
  mask_top_rows: 2         # 仅 own_fd: PDE 残差排除顶部这么多内部行
  val_every: 5             # 每 N epoch 做一次验证并出 val 图
  save_every: 10           # checkpoint 保存频率 (epoch); 最后一个 epoch 必存。
                           # 每次写约 228MB (.pt + .mdlus), 故建议 >= 10
  use_amp: true            # CUDA 混合精度 (省显存/加速)。安装版 physicsnemo 的 SpectralConv 在非 2^N 网格 + AMP 下会 cuFFT 报错;
                           # patch_spectral_amp.py 已在 train_elder_fno.py 顶部自动 import 修复 (arch=fno 必需, arch=ufno 不受影响)。
  tf32: true               # Ampere+ GPU 上允许 TF32 矩阵乘/卷积 (CPU 无影响)
  compile: false           # torch.compile FNO 前向 (CUDA 上加速; 首轮编译, 适合长训练)
  compile_mode: default    # "default" | "reduce-overhead" | "max-autotune"

seed: 0                    # 随机种子; 0 = 不播种 (>0 时按 rank 播种, DDP 可复现)

validation:
  sample_size: 256         # 验证时采样的样本总数 (除以 batch_size 得验证 iter 数)
